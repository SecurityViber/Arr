---
- name: Deploy Arr stack
  hosts: arr
  become: true
  vars:
    deploy_dir: /opt/arr
    project_root: "{{ playbook_dir | dirname }}"

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - nfs-common
          - cifs-utils
          - smbclient
          - mesa-va-drivers
          - vainfo
        state: present
        update_cache: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker engine and compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Create local config directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}/config"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ project_root }}/docker-compose.yml"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      notify: Restart stack

    - name: Copy .env
      ansible.builtin.copy:
        src: "{{ project_root }}/.env"
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      notify: Restart stack

    - name: Detect host render group GID (for Jellyfin GPU access)
      ansible.builtin.command: getent group render
      register: render_group
      changed_when: false

    - name: Detect host video group GID (for Jellyfin GPU access)
      ansible.builtin.command: getent group video
      register: video_group
      changed_when: false

    - name: Write detected GPU GIDs into deployed .env
      ansible.builtin.lineinfile:
        path: "{{ deploy_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: RENDER_GID, value: "{{ render_group.stdout.split(':')[2] }}" }
        - { key: VIDEO_GID, value: "{{ video_group.stdout.split(':')[2] }}" }
      notify: Restart stack

    - name: Bootstrap media + download directory structure on the NAS share
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm --no-deps --entrypoint sh sabnzbd
          -c "mkdir -p
          /data/downloads/incomplete
          /data/downloads/complete
          /data/downloads/complete/movies
          /data/downloads/complete/tv
          /data/downloads/complete/music
          /data/downloads/complete/xxx
          /data/media/movies
          /data/media/tv
          /data/media/music
          /data/media/xxx"
        chdir: "{{ deploy_dir }}"
      changed_when: false

    - name: Bring stack up
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: >-
        ('Started' in compose_up.stderr) or
        ('Created' in compose_up.stderr) or
        ('Recreated' in compose_up.stderr)

    - name: Wait for SABnzbd to finish writing its initial config
      ansible.builtin.wait_for:
        path: "{{ deploy_dir }}/config/sabnzbd/sabnzbd.ini"
        search_regex: '^api_key\s*=\s*[a-f0-9]{16,}'
        timeout: 120

    - name: Stop SABnzbd before editing config so it cannot overwrite our changes
      ansible.builtin.command: docker compose stop sabnzbd
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: false

    - name: Configure SABnzbd paths and remote access
      community.general.ini_file:
        path: "{{ deploy_dir }}/config/sabnzbd/sabnzbd.ini"
        section: misc
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - { option: download_dir, value: /data/downloads/incomplete }
        - { option: complete_dir, value: /data/downloads/complete }
        - { option: host, value: "0.0.0.0" }
        - { option: host_whitelist, value: "sabnzbd,prowlarr,radarr,sonarr,lidarr,bazarr,jellyseerr,{{ ansible_default_ipv4.address }}" }

    - name: Start SABnzbd with new config
      ansible.builtin.command: docker compose start sabnzbd
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: true

  handlers:
    - name: Restart stack
      ansible.builtin.command: docker compose up -d --force-recreate --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: true
